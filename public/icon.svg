<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="calGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563eb" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle border -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Calendar Base -->
  <g transform="translate(68, 68)" filter="url(#glow)">
    <!-- Calendar Hooks -->
    <rect x="76" y="8" width="28" height="60" rx="14" fill="#3b82f6" />
    <rect x="272" y="8" width="28" height="60" rx="14" fill="#3b82f6" />

    <!-- Calendar Card -->
    <rect x="18" y="36" width="340" height="324" rx="48" fill="url(#calGrad)" />

    <!-- Header bar highlight -->
    <path d="M 18,84 L 358,84 L 358,60 C 358,36 334,36 310,36 L 66,36 C 42,36 18,36 18,60 Z" fill="#1e40af" opacity="0.6" />

    <!-- Calendar White Inner Sheet -->
    <rect x="42" y="104" width="292" height="232" rx="32" fill="#ffffff" />

    <!-- Calendar Grid Slots -->
    <!-- Row 1 -->
    <rect x="68" y="128" width="44" height="34" rx="9" fill="#93c5fd" />
    <rect x="130" y="128" width="44" height="34" rx="9" fill="#93c5fd" />
    <rect x="192" y="128" width="44" height="34" rx="9" fill="#93c5fd" />
    <rect x="254" y="128" width="44" height="34" rx="9" fill="#93c5fd" />

    <!-- Row 2 -->
    <rect x="68" y="180" width="44" height="34" rx="9" fill="#60a5fa" />
    <rect x="130" y="180" width="44" height="34" rx="9" fill="#3b82f6" />
    <rect x="192" y="180" width="44" height="34" rx="9" fill="#93c5fd" />
    <rect x="254" y="180" width="44" height="34" rx="9" fill="#93c5fd" />

    <!-- Row 3 -->
    <rect x="68" y="232" width="44" height="34" rx="9" fill="#93c5fd" />
    <rect x="130" y="232" width="44" height="34" rx="9" fill="#60a5fa" />
    <rect x="192" y="232" width="44" height="34" rx="9" fill="#93c5fd" />
  </g>

  <!-- Overlapping Lab Flask Badge -->
  <g transform="translate(244, 236)">
    <!-- Badge Background Circle with drop shadow -->
    <circle cx="116" cy="116" r="106" fill="#0f172a" stroke="#38bdf8" stroke-width="8" />
    <circle cx="116" cy="116" r="92" fill="url(#bgGrad)" />

    <!-- Lab Flask Icon -->
    <g transform="translate(68, 54)">
      <!-- Flask Neck -->
      <path d="M38 12 L38 38 L16 86 C12 94 18 104 28 104 L68 104 C78 104 84 94 80 86 L58 38 L58 12 Z" 
            fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M32 12 L64 12" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />

      <!-- Liquid inside flask -->
      <path d="M22 84 L74 84 C76 89 74 94 68 96 L28 96 C22 94 20 89 22 84 Z" fill="url(#flaskGrad)" />

      <!-- Liquid Bubbles -->
      <circle cx="48" cy="68" r="4" fill="#38bdf8" />
      <circle cx="38" cy="56" r="3" fill="#bae6fd" />
      <circle cx="58" cy="52" r="2.5" fill="#38bdf8" />
    </g>
  </g>
</svg>
