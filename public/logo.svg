<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background transparent -->
  <defs>
    <linearGradient id="flaskLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="goldSwoop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Golden Swoop Underneath -->
  <path d="M 120 280 C 100 310, 160 365, 270 365 C 340 365, 400 340, 420 310 C 375 348, 280 355, 175 325 C 135 313, 115 295, 120 280 Z" fill="url(#goldSwoop)" />

  <!-- Calendar Container -->
  <g transform="translate(140, 60)">
    <!-- Calendar Top Rings -->
    <rect x="50" y="0" width="18" height="35" rx="9" fill="#0D3B66" />
    <rect x="152" y="0" width="18" height="35" rx="9" fill="#0D3B66" />

    <!-- Calendar Main Blue Body -->
    <rect x="10" y="18" width="200" height="190" rx="36" fill="#0D3B66" />

    <!-- Calendar Inner White Sheet -->
    <rect x="24" y="62" width="172" height="132" rx="20" fill="#FFFFFF" />

    <!-- Calendar Grid Slots -->
    <!-- Row 1 -->
    <rect x="40" y="78" width="24" height="24" rx="5" fill="#E2E8F0" />
    <rect x="74" y="78" width="24" height="24" rx="5" fill="#E2E8F0" />
    <rect x="108" y="78" width="24" height="24" rx="5" fill="#E2E8F0" />
    <rect x="142" y="78" width="24" height="24" rx="5" fill="#E2E8F0" />

    <!-- Row 2 -->
    <rect x="40" y="112" width="24" height="24" rx="5" fill="#E2E8F0" />
    <!-- Golden Checkmark Slot -->
    <rect x="74" y="112" width="24" height="24" rx="5" fill="#F59E0B" />
    <path d="M 80 124 L 84 128 L 93 118" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="108" y="112" width="24" height="24" rx="5" fill="#CBD5E1" />
    <rect x="142" y="112" width="24" height="24" rx="5" fill="#CBD5E1" />

    <!-- Row 3 -->
    <rect x="40" y="146" width="24" height="24" rx="5" fill="#CBD5E1" />
    <rect x="74" y="146" width="24" height="24" rx="5" fill="#CBD5E1" />
    <rect x="108" y="146" width="24" height="24" rx="5" fill="#CBD5E1" />
    <rect x="142" y="146" width="24" height="24" rx="5" fill="#CBD5E1" />
  </g>

  <!-- Laboratory Flask Overlapping -->
  <g transform="translate(245, 110)">
    <!-- Flask Outline / Shadow Behind -->
    <path d="M 68 18 L 88 18 C 92 18 94 20 94 24 C 94 27 92 29 88 29 L 85 29 L 85 68 L 132 142 C 140 154 133 168 116 168 L 40 168 C 23 168 16 154 24 142 L 71 68 L 71 29 L 68 29 C 64 29 62 27 62 24 C 62 20 64 18 68 18 Z" 
          fill="#FFFFFF" stroke="#0D3B66" stroke-width="15" stroke-linejoin="round" />

    <!-- Liquid Inside Flask -->
    <path d="M 45 130 Q 78 122 111 130 C 122 147 122 156 112 156 L 44 156 C 34 156 34 147 45 130 Z" 
          fill="url(#flaskLiquid)" rx="8" />

    <!-- Flask Glass Shine / Liquid Highlight -->
    <ellipse cx="64" cy="144" rx="8" ry="4" fill="#FEF3C7" opacity="0.8" />

    <!-- Bubbles Rising -->
    <circle cx="82" cy="98" r="5" fill="#F59E0B" />
    <circle cx="72" cy="80" r="3.5" fill="#FBBF24" />
  </g>

  <!-- Typography: RESERVE LABS -->
  <text x="250" y="420" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#0D3B66" letter-spacing="4">
    RESERVE
  </text>

  <!-- Subtitle: — L A B S — -->
  <g transform="translate(0, 442)">
    <!-- Left gold bar -->
    <line x1="120" y1="18" x2="185" y2="18" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
    <!-- LABS Text -->
    <text x="250" y="27" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#F59E0B" letter-spacing="16">
      LABS
    </text>
    <!-- Right gold bar -->
    <line x1="315" y1="18" x2="380" y2="18" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
